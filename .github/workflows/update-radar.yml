name: Update radar bitmap

on:
  schedule:
    # Off the standard :00/:15/:30/:45 marks on purpose -- GitHub's own docs
    # note scheduled workflows can be delayed under high load, and the top
    # of every hour (plus other common minute marks) is exactly when load
    # peaks, since huge numbers of repos schedule crons at those "obvious"
    # times. Offsetting to :12/:42 avoids that crowd.
    - cron: "29 * * * *"   # every 30 minutes, at 12 and 42 past the hour
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can push to the data branch
  actions: write             # needed to delete old workflow runs, see cleanup step below

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Fetch and render radar frame
        run: python fetch_radar.py

      # Publishes radar_300x400_2bpp.bin + the debug PNGs to a separate
      # `data` branch as ONE commit, force-pushed each run. This branch
      # never accumulates history -- it's always exactly 1 commit, so repo
      # size stays flat no matter how many times this runs. `main` never
      # gets touched by this step, keeping your code history clean.
      - name: Publish to data branch (squashed, no growing history)
        run: |
          mkdir /tmp/data-branch
          cp radar_300x400_2bpp.bin /tmp/data-branch/
          cd /tmp/data-branch

          git init -q
          git checkout -q -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Radar update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps only the most recent few runs of THIS workflow -- this only
      # affects the Actions run history/logs list, nothing to do with the
      # data branch or the radar content itself. KEEP_RUNS below is set to
      # 3 as a small safety margin rather than 1, in case you ever want to
      # glance at the one before it too -- set to 1 if you genuinely only
      # ever want the single latest run kept.
      - name: Delete old workflow runs
        run: |
          KEEP_RUNS=3
          gh run list --workflow=update-radar.yml --limit 200 --json databaseId \
            --jq ".[${KEEP_RUNS}:] | .[].databaseId" | \
          while read -r run_id; do
            gh run delete "$run_id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
