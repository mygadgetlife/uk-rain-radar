name: Update radar bitmap

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay this a few min under load)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated file

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Fetch and render radar frame
        run: python fetch_radar.py

      - name: Commit updated bitmap
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar_400x300_2bpp.bin
          git diff --quiet --cached || git commit -m "Update radar frame"
          git push
