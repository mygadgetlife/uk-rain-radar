name: Update radar bitmapp

on:
  schedule:
    - cron: "*/15 * * * *" # Runs at minutes 7, 22, 37, and 52  
    workflow_dispatch: # lets you trigger it manually from the Actions tab
    
permissions:
  contents: write            # needed so the workflow can commit the updated file

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Fetch and render radar frame
        run: python fetch_radar.py

      - name: Commit updated bitmap
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar_300x400_2bpp.bin debug_composite.png debug_preview.png
          git diff --quiet --cached || git commit -m "Update radar frame"
          git push
